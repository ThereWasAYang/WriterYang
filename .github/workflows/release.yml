name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - name: Secret scan
        run: python -c "from pathlib import Path; from novel.core.security import scan_security; r=scan_security(Path('.')); assert r.ok, [(f.code, str(f.path), f.line) for f in r.findings]"
      - name: Test
        run: pytest -m "not real_api and not web_e2e" --cov=novel --cov-report=term-missing -q
      - name: Audit Python dependencies
        run: python -m pip_audit .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src scripts
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Web UI E2E smoke
        run: pytest -m web_e2e -q
      - name: Build
        run: python -m build
      - name: Check dist
        run: twine check dist/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
          generate_release_notes: true
