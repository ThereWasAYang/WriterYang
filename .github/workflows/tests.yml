name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src scripts
      - name: Strict core type check
        run: mypy --strict src/novel/core/contracts src/novel/core/workflow_runtime.py src/novel/core/artifact_store.py src/novel/core/transactions.py
      - name: Run tests without real APIs or browser E2E
        if: matrix.python-version != '3.12'
        run: pytest -m "not real_api and not web_e2e" -q
      - name: Coverage gate
        if: matrix.python-version == '3.12'
        run: pytest -m "not real_api and not web_e2e" --cov=novel --cov-report=term-missing --cov-report=xml -q
      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        run: python -m pip_audit .
      - name: Search 10/100/500 chapter performance gate
        if: matrix.python-version == '3.12'
        run: >-
          python scripts/benchmark_search.py --query-runs 10
          --max-query-p95-ms 250 --max-incremental-refresh-ms 5000 --max-peak-memory-mb 64
      - name: Run secret scanner
        run: python -c "from pathlib import Path; from novel.core.security import scan_security; r=scan_security(Path('.')); assert r.ok, [(f.code, str(f.path), f.line) for f in r.findings]"
      - name: Build package
        run: python -m build
      - name: Check package
        run: twine check dist/*
      - name: Check CLI entrypoint
        run: novel --version
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - name: Install Playwright Chromium
        run: python -m playwright install chromium
      - name: Run Web UI E2E
        run: pytest -m web_e2e -q

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install verified toolchain
        run: python -m pip install -c requirements/constraints.txt -e ".[dev]"
      - name: Run macOS filesystem and Web security smoke
        run: pytest tests/test_transactions.py tests/test_security.py tests/test_web.py -k "loopback or ipv6 or project_lock or atomic" -q
      - name: Check CLI entrypoint
        run: novel --version
