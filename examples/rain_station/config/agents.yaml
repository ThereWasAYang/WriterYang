schema_version: 2
default:
  provider: "deepseek"
  base_url_env: "WRITERYANG_REAL_BASE_URL"
  api_key_env: "WRITERYANG_REAL_API_KEY"
  model: "your-model-name"
  reasoning: "medium"
  thinking:
    type: "disabled"
  max_context_tokens: 128000
  max_tokens: 8192
  temperature: 0.5
  timeout_seconds: 60
  max_retries: 1
agents:
  orchestrator:
    reasoning: "medium"
    max_context_tokens: 128000
    max_tokens: 4096
    temperature: 0.4
    timeout_seconds: 60
    max_retries: 1
  inspiration:
    reasoning: "medium"
    max_context_tokens: 64000
    max_tokens: 4096
    temperature: 0.8
    timeout_seconds: 60
    max_retries: 1
  canon:
    reasoning: "medium"
    max_context_tokens: 64000
    max_tokens: 8192
    temperature: 0.5
    timeout_seconds: 60
    max_retries: 1
  plot:
    reasoning: "high"
    max_context_tokens: 128000
    max_tokens: 8192
    temperature: 0.6
    timeout_seconds: 90
    max_retries: 1
  writer:
    reasoning: "high"
    max_context_tokens: 128000
    max_tokens: 24000
    temperature: 0.9
    timeout_seconds: 120
    max_retries: 1
  polish:
    reasoning: "medium"
    max_context_tokens: 128000
    max_tokens: 24000
    temperature: 0.7
    timeout_seconds: 90
    max_retries: 1
  audit:
    reasoning: "low"
    max_context_tokens: 64000
    max_tokens: 8192
    temperature: 0.2
    timeout_seconds: 60
    max_retries: 1
  revision:
    reasoning: "medium"
    max_context_tokens: 128000
    max_tokens: 24000
    temperature: 0.6
    timeout_seconds: 120
    max_retries: 1
  state_update:
    reasoning: "low"
    max_context_tokens: 64000
    max_tokens: 8192
    temperature: 0.2
    timeout_seconds: 60
    max_retries: 1
