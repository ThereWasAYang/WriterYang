schema_version: 2
active_provider: "local"
providers:
  local:
    provider: "local_hash"
    model: "local-hash-v1"
    dimensions: 32
    batch_size: 64
  dashscope:
    provider: "dashscope"
    base_url_env: "DASHSCOPE_EMBEDDING_BASE_URL"
    api_key_env: "DASHSCOPE_API_KEY"
    model: "text-embedding-v4"
    dimensions: 2048
    batch_size: 16
    timeout_seconds: 30
    max_retries: 1
  zhipu:
    provider: "zhipu"
    base_url_env: "ZHIPU_EMBEDDING_BASE_URL"
    api_key_env: "ZHIPU_API_KEY"
    model: "embedding-3"
    dimensions: 2048
    batch_size: 16
    timeout_seconds: 30
    max_retries: 1
