schema_version: 2 # Agent 配置 schema 版本。
agents: # 每个 agent 可以使用独立模型配置。
  orchestrator: # 编排 agent：根据用户请求选择工作流。
    provider: "mock" # provider 类型；示例默认 mock，离线可运行。
    base_url_env: "WUXIA_ORCHESTRATOR_BASE_URL" # 真实 API base URL 环境变量名；mock 不使用。
    api_key_env: "WUXIA_ORCHESTRATOR_API_KEY" # API Key 环境变量名；不要写真实 key。
    model: "mock-orchestrator" # 模型名；真实使用时替换为厂商模型名。
    reasoning: "medium" # 推理强度提示；并非所有 provider 都支持。
    thinking: # 厂商 thinking 开关。
      type: "disabled" # 默认关闭，避免输出思考内容污染结果。
    max_context_tokens: 64000 # 建议上下文窗口上限，用于未来截断/检索策略。
    max_tokens: 4096 # 单次最大输出 token。
    temperature: 0.3 # 随机性；编排任务建议低温。
    timeout_seconds: 60 # 请求超时时间。
    max_retries: 1 # 失败重试次数。
  inspiration: # 灵感 agent：生成主题、氛围和弱总纲。
    provider: "mock" # 离线演示使用 mock。
    base_url_env: "WUXIA_INSPIRATION_BASE_URL" # 真实 API base URL 环境变量名。
    api_key_env: "WUXIA_INSPIRATION_API_KEY" # API Key 环境变量名。
    model: "mock-inspiration" # 灵感模型名。
    reasoning: "medium" # 灵感阶段可中等推理。
    thinking: # thinking 配置。
      type: "disabled" # 默认关闭。
    max_context_tokens: 64000 # 灵感阶段通常不需要超长上下文。
    max_tokens: 4096 # 弱总纲输出长度。
    temperature: 0.8 # 灵感生成需要一定发散。
    timeout_seconds: 60 # 超时时间。
    max_retries: 1 # 重试次数。
  canon: # 设定 agent：生成人物、地点、物品、世界规则和伏笔 proposal。
    provider: "mock" # 示例默认 mock。
    base_url_env: "WUXIA_CANON_BASE_URL" # 真实 API base URL 环境变量名。
    api_key_env: "WUXIA_CANON_API_KEY" # API Key 环境变量名。
    model: "mock-canon" # 设定模型名。
    reasoning: "medium" # 设定需要兼顾创造和一致性。
    thinking: # thinking 配置。
      type: "disabled" # 默认关闭。
    max_context_tokens: 64000 # canon 需要读取 inspiration 和已有 canon。
    max_tokens: 8192 # proposal JSON 可能较长。
    temperature: 0.5 # 中低温，减少 ID 和 schema 漂移。
    timeout_seconds: 60 # 超时时间。
    max_retries: 1 # 重试次数。
  plot: # 章节计划 agent：生成 plan.json 和 plan.md。
    provider: "mock" # 示例默认 mock。
    base_url_env: "WUXIA_PLOT_BASE_URL" # 真实 API base URL 环境变量名。
    api_key_env: "WUXIA_PLOT_API_KEY" # API Key 环境变量名。
    model: "mock-plot" # 章节规划模型名。
    reasoning: "high" # 规划要综合伏笔、状态和时间线。
    thinking: # thinking 配置。
      type: "disabled" # 复杂项目可改为 enabled。
    max_context_tokens: 128000 # 章节规划建议较大上下文。
    max_tokens: 8192 # plan JSON 输出长度。
    temperature: 0.6 # 保持剧情弹性但不太发散。
    timeout_seconds: 90 # 规划可能略慢。
    max_retries: 1 # 重试次数。
  writer: # 写作 agent：根据计划生成 draft.md。
    provider: "mock" # 示例默认 mock。
    base_url_env: "WUXIA_WRITER_BASE_URL" # 真实 API base URL 环境变量名。
    api_key_env: "WUXIA_WRITER_API_KEY" # API Key 环境变量名。
    model: "mock-writer" # 正文模型名。
    reasoning: "high" # 长文写作需要理解计划和上下文。
    thinking: # thinking 配置。
      type: "disabled" # 正文输出建议关闭 thinking。
    max_context_tokens: 128000 # 写作需读取计划、canon、state、timeline。
    max_tokens: 24000 # 长章节输出 token。
    temperature: 0.9 # 正文生成允许较高语言变化。
    timeout_seconds: 120 # 长文请求超时应更高。
    max_retries: 1 # 重试次数。
  polish: # 润色 agent：生成 polished.md。
    provider: "mock" # 示例默认 mock。
    base_url_env: "WUXIA_POLISH_BASE_URL" # 真实 API base URL 环境变量名。
    api_key_env: "WUXIA_POLISH_API_KEY" # API Key 环境变量名。
    model: "mock-polish" # 润色模型名。
    reasoning: "medium" # 润色需要保留事实并改善语言。
    thinking: # thinking 配置。
      type: "disabled" # 润色正文建议关闭 thinking。
    max_context_tokens: 128000 # 润色需要读取 draft、plan 和设定。
    max_tokens: 24000 # 润色输出长度。
    temperature: 0.7 # 中温改善表达，避免剧情漂移。
    timeout_seconds: 90 # 超时时间。
    max_retries: 1 # 重试次数。
  audit: # 审核 agent：检查 canon/state/timeline/plan/style 冲突。
    provider: "mock" # 示例默认 mock。
    base_url_env: "WUXIA_AUDIT_BASE_URL" # 真实 API base URL 环境变量名。
    api_key_env: "WUXIA_AUDIT_API_KEY" # API Key 环境变量名。
    model: "mock-audit" # 审核模型名。
    reasoning: "medium" # 审核需要细节比对。
    thinking: # thinking 配置。
      type: "disabled" # 复杂审核可改为 enabled。
    max_context_tokens: 128000 # 审核可能需要读取全文和设定。
    max_tokens: 8192 # audit JSON 输出长度。
    temperature: 0.2 # 审核建议低温。
    timeout_seconds: 60 # 超时时间。
    max_retries: 1 # 重试次数。
  state_update: # 状态更新 agent：提取状态变化和时间线事件。
    provider: "mock" # 示例默认 mock。
    base_url_env: "WUXIA_STATE_UPDATE_BASE_URL" # 真实 API base URL 环境变量名。
    api_key_env: "WUXIA_STATE_UPDATE_API_KEY" # API Key 环境变量名。
    model: "mock-state-update" # 状态更新模型名。
    reasoning: "low" # 信息抽取任务不需要过度发散。
    thinking: # thinking 配置。
      type: "disabled" # 默认关闭。
    max_context_tokens: 64000 # 状态更新读取 plan、正文、audit、state、timeline。
    max_tokens: 8192 # proposal JSON 输出长度。
    temperature: 0.2 # 低温避免创造正文中没有发生的事件。
    timeout_seconds: 60 # 超时时间。
    max_retries: 1 # 重试次数。
