schema_version: 2 # Embedding 配置 schema 版本。
active_provider: "local" # 当前启用的 embedding provider；local 可离线运行。
providers: # 可选 embedding provider 列表。
  local: # 本地 hash embedding，用于无 API Key 搜索演示。
    provider: "local_hash" # provider 类型。
    model: "local-hash-v1" # 本地 embedding 模型标识。
    api_key_env: "WUXIA_LOCAL_EMBEDDING_API_KEY" # local_hash 不使用，仅用于展示字段含义。
    base_url_env: "WUXIA_LOCAL_EMBEDDING_BASE_URL" # local_hash 不使用，仅用于展示字段含义。
    dimensions: 32 # 向量维度。
    batch_size: 64 # 单批处理文本数量。
    timeout_seconds: 10 # local_hash 实际不发网络请求。
    max_retries: 0 # local_hash 不需要重试。
  dashscope: # 阿里 DashScope text-embedding-v4 配置模板。
    provider: "dashscope" # provider 类型。
    model: "text-embedding-v4" # 模型名。
    api_key_env: "DASHSCOPE_API_KEY" # API Key 环境变量名。
    base_url_env: "DASHSCOPE_EMBEDDING_BASE_URL" # base URL 环境变量名。
    dimensions: 2048 # 期望向量维度。
    batch_size: 16 # 真实 API 建议较小批量。
    timeout_seconds: 30 # 请求超时时间。
    max_retries: 1 # 失败重试次数。
  zhipu: # 智谱 embedding-3 配置模板。
    provider: "zhipu" # provider 类型。
    model: "embedding-3" # 模型名。
    api_key_env: "ZHIPU_API_KEY" # API Key 环境变量名。
    base_url_env: "ZHIPU_EMBEDDING_BASE_URL" # base URL 环境变量名。
    dimensions: 2048 # 期望向量维度。
    batch_size: 16 # 真实 API 建议较小批量。
    timeout_seconds: 30 # 请求超时时间。
    max_retries: 1 # 失败重试次数。
