[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "writeryang"
version = "0.1.0"
description = "AI-assisted long-form novel writing workspace and CLI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "WriterYang" }
]
keywords = ["novel", "writing", "cli", "agents", "fiction"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
]
dependencies = [
  "pydantic>=2.13",
  "PyYAML>=6.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "playwright>=1.60",
  "pytest>=9.0",
  "ruff>=0.8",
  "twine>=5.0",
]

[project.scripts]
novel = "novel.cli:main"

[tool.pytest.ini_options]
markers = [
  "real_api: tests that call a real OpenAI-compatible API and require local credentials",
  "web_e2e: browser-based Web UI end-to-end tests",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
no_implicit_optional = false
strict_optional = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
novel = ["web_static/*.html", "web_static/*.css", "web_static/*.js", "prompts/*.txt", "prompts/partials/*.txt"]

[tool.setuptools.data-files]
"schemas" = ["schemas/*.json"]
